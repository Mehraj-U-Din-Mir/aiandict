<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glowRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Hexagonal Shield -->
  <polygon points="50,4 90,26 90,74 50,96 10,74 10,26" 
           fill="#0b1120" 
           stroke="url(#cyberGrad)" 
           stroke-width="2.5" 
           stroke-linejoin="round"
           filter="url(#softGlow)"/>

  <!-- Inner Circuit Grid Lines -->
  <path d="M50,15 L50,38 M50,62 L50,85 M22,33 L40,44 M60,56 L78,67 M78,33 L60,44 M40,56 L22,67" 
        stroke="#38bdf8" 
        stroke-width="1.5" 
        stroke-linecap="round" 
        opacity="0.45"/>

  <!-- Neural Connection Nodes -->
  <circle cx="50" cy="15" r="3" fill="#06b6d4"/>
  <circle cx="50" cy="85" r="3" fill="#8b5cf6"/>
  <circle cx="22" cy="33" r="3" fill="#38bdf8"/>
  <circle cx="78" cy="33" r="3" fill="#06b6d4"/>
  <circle cx="22" cy="67" r="3" fill="#6366f1"/>
  <circle cx="78" cy="67" r="3" fill="#a855f7"/>

  <!-- Central Microchip Core -->
  <rect x="36" y="36" width="28" height="28" rx="6" 
        fill="url(#cyberGrad)" 
        stroke="#ffffff" 
        stroke-width="1.2"/>

  <!-- Central AI Circuit Symbol -->
  <path d="M44,50 L56,50 M50,44 L50,56" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="2" fill="#ffffff"/>
  
  <!-- Corner Accent Pin Dots -->
  <circle cx="40" cy="40" r="1.2" fill="#ffffff" opacity="0.8"/>
  <circle cx="60" cy="40" r="1.2" fill="#ffffff" opacity="0.8"/>
  <circle cx="40" cy="60" r="1.2" fill="#ffffff" opacity="0.8"/>
  <circle cx="60" cy="60" r="1.2" fill="#ffffff" opacity="0.8"/>
</svg>
