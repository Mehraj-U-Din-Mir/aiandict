{% extends "base.html" %}
{% block title %}Student Portal — Sign In{% endblock %}

{% block body %}
<div class="container my-2 my-md-3 py-1">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-7 col-sm-9">
      
      <!-- Role Switcher Pills -->
      <div class="d-flex justify-content-center mb-2.5">
        <div class="nav-pills-modern">
          <a href="{{ url_for('student_login') }}" class="nav-link active py-1 px-3">
            <i class="bi bi-person-badge me-1"></i> Student
          </a>
          <a href="{{ url_for('faculty_login') }}" class="nav-link py-1 px-3">
            <i class="bi bi-mortarboard me-1"></i> Faculty
          </a>
          <a href="{{ url_for('admin_login') }}" class="nav-link py-1 px-3">
            <i class="bi bi-shield-lock me-1"></i> Admin
          </a>
        </div>
      </div>

      <!-- Glassmorphic Auth Panel -->
      <div class="glass-panel p-3.5 p-md-4 position-relative overflow-hidden shadow-2xl">
        <!-- Top Accent Gradient Line -->
        <div style="position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: var(--grad-primary);"></div>

        <div class="text-center mb-3">
          <div class="stat-icon-wrapper mx-auto mb-2" style="width: 44px; height: 44px; font-size: 1.35rem;">
            <i class="bi bi-person-badge-fill"></i>
          </div>
          <h4 class="fw-bold text-white brand-font mb-1 fs-5">Student Portal Login</h4>
          <p class="text-slate-muted small mb-0" style="font-size: 0.78rem;">Submit projects, track approvals &amp; verify participation.</p>
        </div>

        <form method="post" action="{{ url_for('student_login') }}" class="d-grid gap-2.5">
          <div>
            <label class="form-label-modern small mb-1"><i class="bi bi-person-badge text-cyan"></i> Academic Email or Roll Number</label>
            <input class="form-control form-control-modern py-2" name="email" type="text" placeholder="student@gvei.com or Roll No (e.g. 24-AI-01)" required autocomplete="username">
          </div>

          <div>
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label-modern small mb-0"><i class="bi bi-key-fill text-cyan"></i> Password</label>
              <a href="#" class="text-slate-muted text-xs text-decoration-none hover-cyan" onclick="alert('Please contact your department faculty mentor to reset your password.'); return false;">Forgot?</a>
            </div>
            <div class="position-relative">
              <input class="form-control form-control-modern py-2 pe-5" id="studentPasswordInput" name="password" type="password" placeholder="••••••••" required autocomplete="current-password">
              <button type="button" class="btn btn-sm text-slate-muted position-absolute end-0 top-50 translate-middle-y me-2 border-0 bg-transparent" onclick="togglePasswordVisibility('studentPasswordInput', this)">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <div class="pt-1">
            <button type="submit" class="btn-primary-glow w-100 py-2">
              <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Student Corner
            </button>
          </div>
        </form>

        <div class="text-center mt-3 pt-2 border-top border-secondary border-opacity-30">
          <p class="text-slate-muted small mb-0" style="font-size: 0.78rem;">
            Don't have an account yet? 
            <a href="{{ url_for('student_register') }}" class="text-cyan fw-semibold text-decoration-none">
              Register Student Account &rarr;
            </a>
          </p>
        </div>

      </div>

    </div>
  </div>
</div>

<script>
  function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
      input.type = 'text';
      icon.classList.remove('bi-eye');
      icon.classList.add('bi-eye-slash');
    } else {
      input.type = 'password';
      icon.classList.remove('bi-eye-slash');
      icon.classList.add('bi-eye');
    }
  }
</script>
{% endblock %}
